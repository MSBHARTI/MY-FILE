<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub-Backed File Manager</title>
<style>
  :root{
    --bg:#f4f6f9;
    --surface:#ffffff;
    --border:#e2e5eb;
    --text:#1f2430;
    --text-muted:#6b7280;
    --accent:#4f6df5;
    --accent-hover:#3d59e0;
    --danger:#e5484d;
    --radius:10px;
    --shadow:0 2px 10px rgba(20,25,40,0.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);
    color:var(--text);
  }

  header{
    background:var(--surface);
    border-bottom:1px solid var(--border);
    padding:12px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    position:sticky;
    top:0;
    z-index:50;
  }
  .brand{font-weight:700;font-size:18px;}
  .search-box{
    flex:1;
    max-width:380px;
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:8px;
    padding:6px 10px;
  }
  .search-box input{
    border:none;
    background:transparent;
    outline:none;
    width:100%;
    font-size:14px;
  }

  .app{display:flex;min-height:calc(100vh - 61px);}
  .sidebar{
    width:240px;
    background:var(--surface);
    border-right:1px solid var(--border);
    padding:16px 12px;
    flex-shrink:0;
  }
  .config-box{
    background:#f8fafc;
    border:1px solid var(--border);
    border-radius:8px;
    padding:10px;
    margin-bottom:16px;
    font-size:12px;
  }
  .config-box label{display:block;margin-bottom:4px;font-weight:600;}
  .config-box input{
    width:100%;
    padding:6px;
    border:1px solid var(--border);
    border-radius:4px;
    margin-bottom:8px;
    font-size:11px;
  }

  main{flex:1;padding:20px;min-width:0;}
  .file-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
    gap:14px;
  }
  .file-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:10px;
    text-align:center;
    position:relative;
    cursor:pointer;
  }
  .file-card:hover{box-shadow:var(--shadow);}
  .file-card img.thumb{
    width:100%;
    height:80px;
    object-fit:cover;
    border-radius:6px;
    margin-bottom:6px;
  }
  .file-card .icon{font-size:36px;margin-bottom:6px;}
  .file-card .name{
    font-size:12px;
    font-weight:500;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .btn{
    padding:8px 12px;
    border-radius:6px;
    border:1px solid var(--border);
    background:var(--surface);
    cursor:pointer;
    font-size:13px;
  }
  .btn-primary{background:var(--accent);color:#fff;border-color:var(--accent);}
  input[type=file]{display:none;}
  
  .progress-bar{
    height:4px;
    background:var(--border);
    border-radius:2px;
    overflow:hidden;
    margin-top:10px;
    display:none;
  }
  .progress-fill{height:100%;background:var(--accent);width:0%;}
</style>
</head>
<body>

<header>
  <div class="brand">📁 GitHub File Hub</div>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search DATA directory...">
  </div>
  <button class="btn btn-primary" id="uploadBtn">Upload to DATA/</button>
  <input type="file" id="fileInput" multiple>
</header>

<div class="app">
  <aside class="sidebar">
    <div class="config-box">
      <label for="ghToken">GitHub Personal Token</label>
      <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxx">
      <button class="btn" style="width:100%;" id="saveTokenBtn">Save Token</button>
      <p style="color:var(--text-muted);margin-top:6px;font-size:10px;">Token is saved locally in your browser to authorize direct uploads to <code>/DATA</code>.</p>
    </div>
  </aside>

  <main>
    <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
    <br>
    <div class="file-grid" id="fileGrid"></div>
  </main>
</div>

<script>
(function(){
  "use strict";

  const REPO_OWNER = "MSBHARTI";
  const REPO_NAME = "MY-FILE";
  const TARGET_DIR = "DATA";

  let filesList = [];

  const fileGrid = document.getElementById("fileGrid");
  const fileInput = document.getElementById("fileInput");
  const uploadBtn = document.getElementById("uploadBtn");
  const ghTokenInput = document.getElementById("ghToken");
  const saveTokenBtn = document.getElementById("saveTokenBtn");
  const progressBar = document.getElementById("progressBar");
  const progressFill = document.getElementById("progressFill");

  // Load token from localStorage
  ghTokenInput.value = localStorage.getItem("gh_pat_token") || "";
  saveTokenBtn.onclick = () => {
    localStorage.setItem("gh_pat_token", ghTokenInput.value.trim());
    alert("Token saved!");
    fetchRepoFiles();
  };

  // Fetch files directly from GitHub DATA directory
  async function fetchRepoFiles() {
    fileGrid.innerHTML = "Loading repository files...";
    try {
      const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${TARGET_DIR}`);
      if (!res.ok) throw new Error("Could not load DATA directory");
      filesList = await res.json();
      render();
    } catch (err) {
      fileGrid.innerHTML = `<p style="color:var(--danger)">Error loading DATA folder. Ensure folder exists in GitHub repo.</p>`;
    }
  }

  function render() {
    fileGrid.innerHTML = "";
    const query = document.getElementById("searchInput").value.toLowerCase();
    
    const filtered = filesList.filter(f => f.name.toLowerCase().includes(query));

    if (!filtered.length) {
      fileGrid.innerHTML = "<p>No files in /DATA folder.</p>";
      return;
    }

    filtered.forEach(file => {
      const card = document.createElement("div");
      card.className = "file-card";

      const rawUrl = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/main/${TARGET_DIR}/${file.name}`;
      const ext = file.name.split('.').pop().toLowerCase();

      if (['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg'].includes(ext)) {
        card.innerHTML = `<img class="thumb" src="${rawUrl}" loading="lazy"><div class="name">${file.name}</div>`;
      } else {
        card.innerHTML = `<div class="icon">📄</div><div class="name">${file.name}</div>`;
      }

      card.onclick = () => window.open(rawUrl, "_blank");
      fileGrid.appendChild(card);
    });
  }

  // Upload file directly into GitHub repository via API
  async function uploadToGitHub(file) {
    const token = localStorage.getItem("gh_pat_token");
    if (!token) {
      alert("Please enter a GitHub Token in the sidebar to upload files directly to /DATA.");
      return;
    }

    progressBar.style.display = "block";
    progressFill.style.width = "30%";

    const reader = new FileReader();
    reader.onload = async function() {
      const base64Content = reader.result.split(',')[1];
      const targetPath = `${TARGET_DIR}/${file.name}`;

      progressFill.style.width = "60%";

      try {
        const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${targetPath}`, {
          method: "PUT",
          headers: {
            "Authorization": `token ${token}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: `Upload ${file.name} via Web File Manager`,
            content: base64Content
          })
        });

        if (response.ok) {
          progressFill.style.width = "100%";
          setTimeout(() => { progressBar.style.display = "none"; }, 1000);
          fetchRepoFiles();
        } else {
          const errData = await response.json();
          alert("Upload failed: " + errData.message);
          progressBar.style.display = "none";
        }
      } catch (e) {
        alert("Error uploading file to GitHub.");
        progressBar.style.display = "none";
      }
    };
    reader.readAsDataURL(file);
  }

  uploadBtn.onclick = () => fileInput.click();
  fileInput.onchange = (e) => {
    if (e.target.files.length) {
      uploadToGitHub(e.target.files[0]);
    }
  };

  document.getElementById("searchInput").oninput = render;

  fetchRepoFiles();
})();
</script>
</body>
</html>
